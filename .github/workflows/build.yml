name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run tests
      run: go test -v ./...
    
    - name: Run tests with race detector
      run: go test -race -v ./...
    
    - name: Test build
      run: go build -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        OUTPUT_NAME="backup-util-${{ matrix.goos }}-${{ matrix.goarch }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_NAME="${OUTPUT_NAME}.exe"
        fi
        
        go build \
          -ldflags="-X 'main.version=${GITHUB_REF#refs/tags/}' -X 'main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -X 'main.gitCommit=${GITHUB_SHA}'" \
          -o "${OUTPUT_NAME}" \
          main.go
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: backup-util-*

  auto-tag:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Get current version
      id: current_version
      run: |
        # Get the latest tag
        LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
        if [ -z "$LATEST_TAG" ]; then
          LATEST_TAG="v1.0.0"
        fi
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        
        # Extract version numbers
        VERSION=${LATEST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        
        # Auto-increment patch version
        PATCH=$((PATCH + 1))
        NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $LATEST_TAG -> New version: $NEW_VERSION"

    - name: Check if should create tag
      id: should_tag
      run: |
        # Check if there are significant changes since last tag
        LATEST_TAG="${{ steps.current_version.outputs.latest_tag }}"
        
        # Get commits since last tag
        if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
          CHANGES=$(git log --oneline "$LATEST_TAG"..HEAD -- . ':!README.md' ':!docs/' | wc -l)
        else
          CHANGES=1
        fi
        
        echo "Changes since last tag: $CHANGES"
        
        if [ "$CHANGES" -gt 0 ]; then
          echo "should_create_tag=true" >> $GITHUB_OUTPUT
          echo "Will create new tag due to $CHANGES changes"
        else
          echo "should_create_tag=false" >> $GITHUB_OUTPUT
          echo "No significant changes, skipping tag creation"
        fi

    - name: Create and push new tag
      if: steps.should_tag.outputs.should_create_tag == 'true'
      run: |
        NEW_VERSION="${{ steps.current_version.outputs.new_version }}"
        
        # Create commit message based on recent changes
        COMMIT_MSG="Automated release $NEW_VERSION"
        
        # Get recent changes for tag annotation
        LATEST_TAG="${{ steps.current_version.outputs.latest_tag }}"
        if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
          CHANGES=$(git log --oneline --pretty=format:"- %s" "$LATEST_TAG"..HEAD -- . ':!README.md' ':!docs/' | head -10)
        else
          CHANGES=$(git log --oneline --pretty=format:"- %s" HEAD~5..HEAD | head -5)
        fi
        
        TAG_MESSAGE=$(cat <<EOF
Release $NEW_VERSION

Automated release with recent changes:
$CHANGES

Build: $(date -u +%Y-%m-%dT%H:%M:%SZ)
Commit: ${GITHUB_SHA:0:7}
EOF
)
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Create and push tag
        git tag -a "$NEW_VERSION" -m "$TAG_MESSAGE"
        git push origin "$NEW_VERSION"
        
        echo "Created and pushed tag: $NEW_VERSION"