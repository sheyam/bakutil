name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Get version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Run tests before build
      run: |
        echo "Running tests to ensure enhanced features work..."
        go test -v ./...
        
    - name: Verify enhanced features
      run: |
        echo "Verifying enhanced backup functionality is present..."
        grep -r "performPostBackupVerification\|generateBackupSummary" internal/backup/ || {
          echo "ERROR: Enhanced backup features not found!"
          exit 1
        }
        echo "✅ Enhanced features verified"

    - name: Build binaries
      run: |
        mkdir -p build
        
        platforms=(
          "linux/amd64"
          "linux/arm64"
          "darwin/amd64" 
          "darwin/arm64"
          "windows/amd64"
        )
        
        for platform in "${platforms[@]}"; do
          platform_split=(${platform//\// })
          GOOS=${platform_split[0]}
          GOARCH=${platform_split[1]}
          
          output_name="backup-util-${{ steps.version.outputs.VERSION }}-${GOOS}-${GOARCH}"
          if [ $GOOS = "windows" ]; then
            output_name+='.exe'
          fi
          
          echo "Building for $GOOS/$GOARCH..."
          env GOOS=$GOOS GOARCH=$GOARCH go build \
            -ldflags="-X 'main.version=${{ steps.version.outputs.VERSION }}' -X 'main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)' -X 'main.gitCommit=${GITHUB_SHA}'" \
            -o "build/${output_name}" \
            main.go
          
          # Verify the binary was created
          if [ ! -f "build/${output_name}" ]; then
            echo "ERROR: Failed to build ${output_name}"
            exit 1
          fi
          
          echo "✅ Successfully built ${output_name}"
        done

    - name: Test binary functionality
      run: |
        echo "Testing built binary functionality..."
        chmod +x build/backup-util-${{ steps.version.outputs.VERSION }}-linux-amd64
        ./build/backup-util-${{ steps.version.outputs.VERSION }}-linux-amd64 --help | grep -E "(backup|verify|validate)" || {
          echo "ERROR: Binary missing expected commands!"
          exit 1
        }
        echo "✅ Binary functionality verified"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/*
        generate_release_notes: true